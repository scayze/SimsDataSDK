[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sims4-sdk"
version = "0.8.0"
description = "A Python SDK for reading The Sims 4 game data, packages, saves, and tray files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scayze" }]
keywords = ["sims4", "the-sims-4", "dbpf", "modding", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mwparserfromhell>=0.7",
]
validation = [
    "mwparserfromhell>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sims4_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: reads a real Sims 4 installation from disk (skipped when not present)",
    "slow: takes longer than a few seconds (usually a full catalog build)",
]
